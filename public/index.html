<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landscape</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    [hidden] {
      display: none !important;
    }

    #landscape {
      position: fixed;
      inset: 0;
      background: #53635b;
    }

    #background,
    #hotspots {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #background {
      object-fit: cover;
      object-position: center;
      user-select: none;
      pointer-events: none;
    }

    #hotspots {
      visibility: hidden;
      pointer-events: none;
    }

    .hotspot {
      outline: none;
    }

    .hotspot polygon {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      pointer-events: all;
      cursor: pointer;
      transition: fill 180ms ease, stroke 180ms ease;
    }

    .hotspot:hover polygon {
      fill: rgba(255, 255, 255, 0.09);
      stroke: rgba(255, 255, 255, 0.55);
    }

    .hotspot:focus-visible polygon {
      fill: rgba(255, 255, 255, 0.15);
      stroke: #fff;
      stroke-width: 3;
    }

    #subpage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      outline: none;
    }

    #page-title {
      margin: 0;
      font: 400 32px/1.2 system-ui, sans-serif;
    }

    @media (prefers-reduced-motion: reduce) {
      .hotspot polygon {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <!--
    Save this as public/index.html.
    Keep the photograph at assets/background_2.jpg.

    Subpages use #/woods, #/village, and #/house.
    Browser Back returns to the landscape.
  -->

  <main id="landscape" aria-label="Interactive landscape">
    <img
      id="background"
      src="../assets/background_2.jpg"
      alt=""
      draggable="false"
    >

    <svg
      id="hotspots"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="xMidYMid slice"
      role="group"
      aria-label="Places to explore"
    >
      <!-- Coordinates are percentages of the original photograph. -->

      <a
        id="woods-link"
        class="hotspot"
        href="#/woods"
        aria-label="Explore the woods"
        tabindex="0"
      >
        <polygon data-points="
          0,25.4
          7.5,27.7
          16.5,32.4
          26.7,36.7
          35.5,39.9
          43.5,43.2
          50,45
          51,47
          43,46
          33,44
          23,42
          14,40
          6,37
          0,36
        "></polygon>
      </a>

      <a
        id="village-link"
        class="hotspot"
        href="#/village"
        aria-label="Visit the village"
        tabindex="0"
      >
        <polygon data-points="
          57,40.9
          67.7,41.7
          76.4,40.3
          83.9,41.4
          84.6,43.5
          92.9,42
          97.2,45.8
          96,51.3
          87,51
          79.1,48.9
          72.5,47.2
          66.1,44.6
          57.8,43.7
        "></polygon>
      </a>

      <a
        id="house-link"
        class="hotspot"
        href="#/house"
        aria-label="Enter the house"
        tabindex="0"
      >
        <polygon data-points="
          25.3,59
          27.4,58.6
          27.6,57.5
          30.8,57
          33.7,58.2
          34.5,59.5
          34.9,61.1
          32.3,61.7
          29.4,61.3
          25.3,60.5
        "></polygon>
      </a>
    </svg>
  </main>

  <main
    id="subpage"
    aria-labelledby="page-title"
    tabindex="-1"
    hidden
  >
    <h1 id="page-title"></h1>
  </main>

  <script>
    const background = document.getElementById("background");
    const hotspots = document.getElementById("hotspots");
    const landscape = document.getElementById("landscape");
    const subpage = document.getElementById("subpage");
    const pageTitle = document.getElementById("page-title");

    const pages = new Set(["woods", "village", "house"]);

    let currentPage = "";

    function alignHotspots() {
      const width = background.naturalWidth;
      const height = background.naturalHeight;

      if (!width || !height) return;

      hotspots.setAttribute("viewBox", `0 0 ${width} ${height}`);

      hotspots.querySelectorAll("[data-points]").forEach(polygon => {
        const points = polygon.dataset.points
          .trim()
          .split(/\s+/)
          .map(pair => {
            const [x, y] = pair.split(",").map(Number);

            return `${x / 100 * width},${y / 100 * height}`;
          })
          .join(" ");

        polygon.setAttribute("points", points);
      });

      /*
       * The SVG and photograph both use centered cover scaling.
       * Hotspots stay aligned when the window changes size.
       */
      hotspots.style.visibility = "visible";
    }

    function showPage() {
      const route = window.location.hash.replace(/^#\/?/, "");
      const previousPage = currentPage;

      currentPage = pages.has(route) ? route : "";

      landscape.hidden = Boolean(currentPage);
      subpage.hidden = !currentPage;
      pageTitle.textContent = currentPage;

      document.title = currentPage || "Landscape";

      if (currentPage) {
        subpage.focus({ preventScroll: true });
      } else if (previousPage) {
        document
          .getElementById(`${previousPage}-link`)
          ?.focus({ preventScroll: true });
      }
    }

    background.addEventListener("load", alignHotspots);

    if (background.complete && background.naturalWidth) {
      alignHotspots();
    }

    window.addEventListener("hashchange", showPage);

    showPage();
  </script>
</body>
</html>
